services:
  - type: web
    name: chronoslayer-life-rpg
    env: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install --include=dev && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

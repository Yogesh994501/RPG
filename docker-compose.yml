version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronoslayer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chronoslayer_dev_password
      POSTGRES_DB: chronoslayer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronoslayer_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:chronoslayer_dev_password@postgres:5432/chronoslayer_db?schema=public"
      JWT_SECRET: "chronoslayer_production_secret_key_change_me_888"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chronoslayer_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
